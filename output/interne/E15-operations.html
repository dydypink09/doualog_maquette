<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Import — DOUALOG Control Tower</title>
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/components.css">
<script src="../assets/icons.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/shell.js"></script>
<script src="../assets/demo.js"></script>
</head>
<body>
<!-- E15 · Dashboards métier Import / Export / Transit (retour client du 06/11/2026, issue #4) — remplacent l'entrée « Dossiers » du menu.
     Une page, trois vues : ?type=import|export|transit. Au clic dans le menu, la vue change sur place (shell.js > onContexte) :
     titre de la page, titre du header (« Trade & Customs Dashboard - Import »…), entrée active, adresse.
     Chaque vue ne compte que les dossiers de son type. Indicateurs (issues #6, #8, #10) : data.js > indicateursDe(type),
     un clic ouvre la liste E01 filtrée sur l'indicateur et le type.
     Tableau des dossiers (Import : issue #7 ; Export : issue #9 et Transit : issue #11, avec Déclarant et Actions) : colonnes par type (COLONNES),
     édition dans la ligne de l'ETA (import), du statut douane, du statut dossier et du commentaire (data.js > modifierSuivi, mémoire de démo) ; chaque modification
     recalcule les indicateurs. Profil Direction : lecture seule. -->
<!-- À VALIDER : fournisseur et pays de provenance fictifs (absents du CDC) ; un statut modifié ici ne change pas la frise du dossier (E02).
     À VALIDER : dossiers de transit fictifs (type absent du CDC, data.js). -->
<div class="c-app">
  <header class="c-topbar" id="topbar"></header>
  <nav class="c-sidebar" id="sidebar" aria-label="Navigation principale"></nav>

  <main class="c-main">
    <div class="c-page-head">
      <div class="c-page-head__title"><h1 id="titre"></h1><span class="c-page-head__meta" id="sous-titre"></span></div>
    </div>

    <div class="c-stats">
      <div class="c-stats__group c-stats__group--ligne" id="stats" role="group" aria-label="Indicateurs — un clic ouvre les dossiers concernés"></div>
    </div>

    <section class="c-card">
      <div class="c-card__head"><h3 id="liste-titre"></h3><span class="c-card__note" id="liste-note"></span></div>
      <div class="c-table-wrap" id="liste-wrap">
        <table class="c-table" id="table">
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="c-empty" id="vide" hidden>
        <svg class="c-icon" aria-hidden="true"><use href="#i-dossiers" id="vide-icone"></use></svg>
        <p class="c-empty__title" id="vide-titre"></p>
        <p class="c-empty__text" id="vide-texte"></p>
      </div>
    </section>
    <p class="u-sr" id="annonce" aria-live="polite"></p>
  </main>
</div>

<script>
(function () {
  var D = window.DOUALOG, F = D.fmt, esc = D.esc;
  function $(id) { return document.getElementById(id); }
  function icon(n, cls) { return '<svg class="c-icon' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#i-' + n + '"></use></svg>'; }

  /* Une entrée par dashboard : titre, sous-titre, type des dossiers (le compte total vient de DOUALOG.volumes(), comme les KPI du header) */
  var VUES = {
    import:  { titre: 'Dashboard Import',  sousTitre: 'Pilotage des opérations d\'importation', nom: 'import',  icone: 'import',  type: 'Import' },
    export:  { titre: 'Dashboard Export',  sousTitre: 'Pilotage des opérations d\'exportation', nom: 'export',  icone: 'export',  type: 'Export' },
    transit: { titre: 'Dashboard Transit', sousTitre: 'Pilotage des opérations de transit',    nom: 'transit', icone: 'transit', type: 'Transit' }
  };
  function lireType() { var t = new URLSearchParams(location.search).get('type'); return VUES[t] ? t : 'import'; }

  /* Indicateurs calculés sur les seuls dossiers du type (critère des issues #6, #8, #10) ; un clic ouvre la liste E01 filtrée */
  function renderStats(c) {
    var v = VUES[c], dossiers = D.tableauDeBord().filter(function (d) { return d.type === v.type; });
    $('stats').innerHTML = D.indicateursDe(c).map(function (k) {
      return '<a class="c-stat c-stat--' + k.ton + '" href="E01-dossiers.html?kpi=' + k.id + '&amp;type=' + v.type + '" title="' + k.label + ' (' + v.nom + ') — ouvrir la liste">' +
        '<span class="c-stat__in"><span class="c-stat__icon">' + icon(k.icone) + '</span><span class="c-stat__value">' + dossiers.filter(k.f).length + '</span>' +
        '<span class="c-stat__label"><span class="is-long">' + k.label + '</span><span class="is-short" aria-hidden="true">' + k.court + '</span></span></span></a>';
    }).join('');
  }

  /* ── Tableau des dossiers : cellules éditables (ETA, statuts, commentaire) ── */
  var lectureSeule = false, courant = null;
  function dis() { return lectureSeule ? ' disabled' : ''; }
  function selectStatut(d, champ, options, valeur, libelle) {
    return '<select class="c-cell-select c-badge--' + D.tonSuivi(valeur) + '" data-champ="' + champ + '" aria-label="' + libelle + ' du dossier ' + d.id + '"' + dis() + '>' +
      (valeur ? '' : '<option value="" selected>—</option>') +
      options.map(function (o) { return '<option' + (o.nom === valeur ? ' selected' : '') + '>' + o.nom + '</option>'; }).join('') + '</select>';
  }
  function texte(x) { return x ? esc(x) : '<span class="u-muted">—</span>'; }
  /* Colonnes communes aux dashboards */
  var COL = {
    reception: { titre: 'Date réception', cls: 'is-num', v: function (d) { return F.date(d.reception); } },
    numero: { titre: 'N° dossier', v: function (d) { return '<a href="E01-dossiers.html?id=' + d.id + '" title="Ouvrir le dossier">' + d.id + '</a>'; } },
    client: { titre: 'Client', v: function (d) { return esc(D.clients[d.client].nom); } },
    douane: { titre: 'Statut douane', v: function (d) { return selectStatut(d, 'statutDouane', D.statutsDouane(d.type), D.statutDouane(d), 'Statut douane'); } },
    dossier: { titre: 'Statut dossier', v: function (d) { return selectStatut(d, 'statutDossier', D.statutsDossier, D.statutDossier(d), 'Statut dossier'); } },
    commentaire: { titre: 'Commentaires', v: function (d) { return '<input class="c-cell-input c-cell-input--texte" type="text" data-champ="commentaire" value="' + esc(d.commentaire || '') + '" placeholder="' + (lectureSeule ? '' : 'Ajouter un commentaire') + '" aria-label="Commentaire du dossier ' + d.id + '"' + dis() + '>'; } },
    declarant: { titre: 'Déclarant', v: function (d) { return texte(D.equipe[d.responsable] && D.equipe[d.responsable].nom); } },
    /* Actions (issue #9) : voir le détail du dossier (panneau E02, dans la liste E01) — colonne figée à droite */
    actions: { titre: 'Actions', cls: 'is-center', actions: true, v: function (d) { return '<a class="c-btn c-btn--icon c-btn--sm" href="E01-dossiers.html?id=' + d.id + '" aria-label="Voir le détail du dossier ' + d.id + '" title="Voir le détail du dossier">' + icon('eye', 'c-icon--sm') + '</a>'; } }
  };
  /* Colonnes par dashboard (Import : issue #7 ; Export : issue #9 ; Transit : issue #11) */
  var COLONNES = {
    import: [COL.reception, COL.numero, COL.client,
      { titre: 'Fournisseur', v: function (d) { return texte(d.fournisseur); } },
      { titre: 'Pays de provenance', v: function (d) { return texte(d.provenance); } },
      { titre: 'Navire', v: function (d) { return d.navire ? esc(d.navire) : d.vol ? 'Vol ' + esc(d.vol) : texte(''); } },
      { titre: 'ETA', v: function (d) { return '<input class="c-cell-input" type="date" data-champ="eta" value="' + (d.eta || '') + '" aria-label="ETA du dossier ' + d.id + '"' + dis() + '>'; } },
      COL.douane, COL.dossier, COL.commentaire],
    export: [COL.reception, COL.numero, COL.client,
      { titre: 'Destinataire', v: function (d) { return texte(d.destinataire); } },
      { titre: 'Pays destination', v: function (d) { return texte(d.destination); } },
      { titre: 'Date clôture', cls: 'is-num', v: function (d) { return d.cloture ? F.date(d.cloture) : texte(''); } },
      COL.douane, COL.dossier, COL.commentaire, COL.declarant, COL.actions],
    /* Transit (issue #11) : statut douane sans Anticipé ni BAE, avec Libéré (data.js > statutsDouane('Transit')) */
    transit: [COL.reception, COL.numero, COL.client,
      { titre: 'Destinataire', v: function (d) { return texte(d.destinataire); } },
      { titre: 'Destination', v: function (d) { return texte(d.destination); } },
      { titre: 'Date livraison', cls: 'is-num', v: function (d) { return d.livraisonPrevue ? F.date(d.livraisonPrevue) : texte(''); } },
      COL.douane, COL.dossier, COL.commentaire, COL.declarant, COL.actions]
  };
  function renderListe(c) {
    var v = VUES[c], cols = COLONNES[c], dossiers = D.tableauDeBord().filter(function (d) { return d.type === v.type; })
      .sort(function (a, b) { return a.reception < b.reception ? 1 : -1; });   // plus récent d'abord
    $('liste-titre').textContent = 'Dossiers ' + v.nom;
    $('liste-note').textContent = dossiers.length + ' dossier' + (dossiers.length > 1 ? 's' : '') + (cols ? (lectureSeule ? ' · lecture seule' : ' · modifiables dans la ligne') : '');
    $('liste-wrap').hidden = !cols || !dossiers.length;
    $('vide').hidden = !$('liste-wrap').hidden;
    if (!cols || !dossiers.length) {
      $('vide-icone').setAttribute('href', '#i-' + v.icone);
      $('vide-titre').textContent = dossiers.length ? dossiers.length + ' dossier' + (dossiers.length > 1 ? 's' : '') + ' ' + v.nom : 'Aucun dossier ' + v.nom;
      $('vide-texte').textContent = cols ? 'Aucun dossier de ce type pour le moment.' : 'La liste des dossiers ' + v.nom + ' s\'affichera ici.';
      return;
    }
    $('table').classList.toggle('c-table--sticky', cols[cols.length - 1].actions === true);   // Actions figée à droite pendant le défilement
    $('thead').innerHTML = cols.map(function (k) { return '<th' + (k.cls ? ' class="' + k.cls + '"' : '') + '>' + k.titre + '</th>'; }).join('');
    $('tbody').innerHTML = dossiers.map(function (d) {
      return '<tr data-id="' + d.id + '">' + cols.map(function (k) { return '<td' + (k.cls ? ' class="' + k.cls + '"' : '') + '>' + k.v(d) + '</td>'; }).join('') + '</tr>';
    }).join('');
    window.DOUALOG_SHELL.suivreDefilement();
  }

  /* Enregistrement au changement : statut → couleur du badge, indicateurs recalculés, bref halo vert sur la cellule */
  var NOMS = { eta: 'ETA', statutDouane: 'statut douane', statutDossier: 'statut dossier', commentaire: 'commentaire' };
  $('tbody').addEventListener('change', function (e) {
    var el = e.target, champ = el.dataset.champ;
    if (!champ || lectureSeule) return;
    var id = el.closest('tr').dataset.id, valeur = champ === 'commentaire' ? el.value.trim() : el.value;
    D.modifierSuivi(id, champ, valeur);
    if (el.tagName === 'SELECT') {
      el.className = 'c-cell-select c-badge--' + D.tonSuivi(valeur);
      var vide = el.querySelector('option[value=""]'); if (vide && valeur) vide.remove();
    }
    var td = el.closest('td'); td.classList.remove('is-saved'); void td.offsetWidth; td.classList.add('is-saved');
    renderStats(courant);
    $('annonce').textContent = 'Dossier ' + id + ' : ' + NOMS[champ] + ' enregistré.';
  });
  /* Profil Direction : lecture seule (data.js > acces) */
  document.addEventListener('dlg:role', function (e) {
    lectureSeule = !!e.detail.acces.lectureSeule;
    if (courant) renderListe(courant);
  });

  function render(c) {
    var v = VUES[c];
    courant = c;
    renderStats(c);
    renderListe(c);
    document.title = v.titre + ' — DOUALOG Control Tower';
    $('titre').textContent = v.titre;
    $('sous-titre').textContent = v.sousTitre;
  }

  var type = lireType();
  window.DOUALOG_SHELL.init({ actif: type, contexte: type, onContexte: render });
  render(type);
})();
</script>
</body>
</html>
